# The release binaries built on GitHub: Linux on ARM (aarch64), macOS (Apple Silicon and Intel) and Windows (MSVC),
# with the dist profile, uploaded as artifacts. release/fetch-ci-builds.sh starts this on master, waits and downloads
# them into target/assets, where release/publish.sh signs them with the Linux x86_64 build (the signing key never leaves
# the release machine). Runs automatically on pull requests that change it or the build scripts; never from ci.yml, whose
# Windows job only lints and tests.
name: Release builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-builds.yml
      - release/build-linux.sh

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The Steam Runtime's arm64 SDK, as the x86_64 build uses its SDK (glibc 2.31: every current distro).
      - name: Build
        env:
          VANA_CPUSET: ""
        run: release/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vana-client-linux-aarch64
          path: target/assets/vana-client-linux-aarch64
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-15
    env:
      # Big Sur, the first macOS on Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.arch == 'x86_64' && '-C target-cpu=x86-64-v2' || '' }}
        run: cargo build --profile dist --locked --target ${{ matrix.arch }}-apple-darwin
      # Apple Silicon runs only signed code: the linker signs ad hoc; check that it did and that the binary starts.
      - name: Check
        run: |
          bin=target/${{ matrix.arch }}-apple-darwin/dist/vana-client
          file "$bin"
          codesign --verify --verbose "$bin" || [ "${{ matrix.arch }}" = x86_64 ]
          arch -${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }} "$bin" --version
          mkdir -p target/assets
          cp "$bin" target/assets/vana-client-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: vana-client-macos-${{ matrix.arch }}
          path: target/assets/vana-client-macos-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      # RUSTFLAGS replaces .cargo/config.toml's, so the static C runtime is asked for here too: no VC++ redistributable.
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2 -C target-feature=+crt-static
        run: cargo build --profile dist --locked --target x86_64-pc-windows-msvc
      - name: Check
        shell: bash
        run: |
          exe=target/x86_64-pc-windows-msvc/dist/vana-client.exe
          objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          test -x "$objdump"
          imports="$("$objdump" -p "$exe")"
          echo "$imports" | grep -q "DLL Name:" || { echo "llvm-objdump listed no imports" >&2; exit 1; }
          if echo "$imports" | grep -iE "DLL Name: (vcruntime|msvcp|api-ms-win-crt)"; then
            echo "the exe needs the VC++ runtime" >&2
            exit 1
          fi
          "$exe" --version
          mkdir -p target/assets
          cp "$exe" target/assets/vana-client-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vana-client-windows-x86_64.exe
          path: target/assets/vana-client-windows-x86_64.exe
          if-no-files-found: error
