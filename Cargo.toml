[workspace]
resolver = "3"
members = ["crates/vana-client"]

# Day-to-day builds: incremental, no LTO. A one-file change rebuilds in seconds (60 s with thin LTO).
[profile.release]
incremental = true

# Binaries we ship (GitHub releases): `cargo build --profile dist`, out in target/dist. As fast as it can be (user):
# whole-program LTO and one codegen unit; release/build-*.sh add the CPU baseline.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1

# CI's tests (`cargo test --profile ci-test`, out in target/ci-test): release with epaint's debug asserts, which catch
# a dropped unapplied TexturesDelta. egui's stay off.
[profile.ci-test]
inherits = "release"

[profile.ci-test.package.epaint]
debug-assertions = true

# Debug builds (cargo build): dependencies optimized and ours lightly, so a debug run is playable; debug assertions
# and overflow checks stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release speed with full debug info, for a debugger (the VS Code launch configs): out in target/release-debug.
[profile.release-debug]
inherits = "release"
debug = true

# gpu-allocator 0.28.0 with one change (src/vulkan/mod.rs, "vana-client:"): wgpu's staging buffers in host memory
# when writes into VRAM through ReBAR measure slow (an eGPU's narrow link). The fork's branch vana-client, pinned by
# rev: a change to the patch is a new commit there and a new rev here.
# cpal 0.18.2 with one change (src/host/pipewire/device.rs, "vana-client:"): no node.group on its PipeWire streams,
# so a voice chat microphone no longer clocks the headset the game plays to. Same scheme as gpu-allocator.
[patch.crates-io]
gpu-allocator = { git = "https://github.com/lenonk/gpu-allocator", rev = "eb8f2afb10c87953852422626c68049aa6d2b1ad" }
cpal = { git = "https://github.com/lenonk/cpal", rev = "813764ce5fceb151e13d236df92f5f09c6a74281" }
# winit 0.30.13, with Android input taken off NativeActivity's AInputQueue (patches/winit/VANA.md).
# Other platforms build the same code as the crates.io crate.
winit = { path = "patches/winit" }
