[workspace]
resolver = "3"
members = ["crates/vana-client"]

# Day-to-day builds: incremental, no LTO. A one-file change rebuilds in seconds (60 s with thin LTO).
[profile.release]
incremental = true

# Binaries we ship (GitHub releases): `cargo build --profile dist`, out in target/dist. As fast as it can be (user):
# whole-program LTO and one codegen unit; release/build-*.sh add the CPU baseline.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
