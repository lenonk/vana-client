[package]
name = "vana-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
dirs = "7.0.0"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
encoding_rs = "0.8.42"
env_logger = "0.11.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
glam = "0.34.1"
hex = "0.4.3"
log = "0.4.34"
md-5 = "0.11.0"
msi = "0.10.0"
png = "0.18.1"
pollster = "1.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = "0.26.6"
unrar = "0.5.8"
ureq = "3"
wgpu = "30.0.1"
winit = "0.30.13"
