[package]
name = "vana-client"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
dirs = "7.0.0"
egui = { version = "0.37", features = ["default_fonts"] }
# Rasterizes the modern name plates (already in the tree through egui).
ab_glyph = "0.2"
egui-wgpu = "0.37"
egui-winit = "0.37"
encoding_rs = "0.8.42"
env_logger = "0.11.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3.4"
glam = "0.34.1"
hex = "0.4.3"
jiff = "0.2"
log = "0.4.34"
md-5 = "0.11.0"
msi = "0.10.0"
png = "0.18.1"
ring = "0.17.14"
pollster = "1.0.1"
# The two-factor setup's QR code (no image or SVG output).
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
texpresso = "2.0.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
# ring, as rustls above: the default aws-lc-rs needs CMake and NASM on Windows.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12", "ring"] }
unrar = "0.5.8"
ureq = "3"
wgpu = "30.0.1"
winit = "0.30.13"
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util", "deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Time", "Win32_Foundation", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
