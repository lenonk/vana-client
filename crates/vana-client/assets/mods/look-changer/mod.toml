name = "Look Changer"
version = "1.0.3"
description = "Changes how characters look on your screen only: your race, face and gear, a target's look copied, one race for everyone else (the dress-up add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Look Changer"
help = "//look race <race>, //look face <1a..8b>, //look <slot> <item | none | own>, //look copy [name], //look others <race | own>, //look reset. Only your screen changes."

[commands.look]
help = "Changes how characters look, on your screen only."
forms = [
  { args = "race <race>", help = "Your race.", params = [{ name = "race", type = "enum", options = ["hume m", "hume f", "elvaan m", "elvaan f", "tarutaru m", "tarutaru f", "mithra", "galka"] }] },
  { args = "face <1a..8b>", help = "Your face.", params = [{ name = "1a..8b", type = "enum", options = ["1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b", "8a", "8b"] }] },
  { args = "<slot> <item | none | own>", help = "A piece of your gear.", params = [{ name = "slot", type = "enum", options = ["head", "body", "hands", "legs", "feet", "main", "sub", "range"] }, { name = "item", type = "item", also = ["none", "own"] }] },
  { args = "copy [name]", help = "Copies a player's look (your target's).", params = [{ name = "name", type = "player" }] },
  { args = "others <race | own>", help = "One race for everyone else.", params = [{ name = "race", type = "enum", options = ["hume m", "hume f", "elvaan m", "elvaan f", "tarutaru m", "tarutaru f", "mithra", "galka"], also = ["own"] }] },
  { args = "reset", help = "Your look back." },
]
